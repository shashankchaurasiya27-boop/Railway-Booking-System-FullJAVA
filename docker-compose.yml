version: '3.8'

services:
  # MySQL 8.0 Database Service
  db:
    image: mysql:8.0
    container_name: railway-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: railway_booking
      MYSQL_USER: railway_user
      MYSQL_PASSWORD: railway_password_here
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/database/unified_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/main/resources/database/test_data.sql:/docker-entrypoint-initdb.d/02_test_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_here"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Railway Booking System Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway-booking-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/railway_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: railway_user
      DB_PASSWORD: railway_password_here
      HEADLESS_MODE: "true"

volumes:
  mysql_data:
