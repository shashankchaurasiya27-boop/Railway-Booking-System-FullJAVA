<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="concBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#0096c7" />
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .c-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
    .c-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #64dfdf; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 18px; fill: #ffd166; }
    .step-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #ffffff; }
    .step-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #caf0f8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #000000; }
  </style>

  <rect width="960" height="420" rx="14" fill="url(#concBg)" stroke="#00b4d8" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(35, 40)">
    <text class="c-title">🛡️ 3-LAYER HIGH-CONCURRENCY TICKET ENGINE</text>
    <text y="22" class="c-sub">Zero Overbooking • Deadlock-Free Ordering • Instant RAC/Waiting Auto-Promotion</text>
  </g>

  <!-- Step 1 Card -->
  <g transform="translate(35, 95)" filter="url(#cShadow)">
    <rect width="270" height="280" rx="10" fill="#0c2340" stroke="#00b4d8" stroke-width="1.2" />
    <circle cx="35" cy="40" r="18" fill="#1e3d59" stroke="#ffd166" stroke-width="1.5" />
    <text x="35" y="46" text-anchor="middle" class="step-num">1</text>
    <text x="65" y="44" class="step-head">Application Fair Lock</text>

    <g transform="translate(20, 80)">
      <rect width="230" height="24" rx="4" fill="#ffd166" />
      <text x="115" y="16" text-anchor="middle" class="badge">ReentrantLock(fair = true)</text>
    </g>

    <text x="20" y="135" class="step-body">• FIFO Request Queueing</text>
    <text x="20" y="160" class="step-body">• Eliminates thread starvation</text>
    <text x="20" y="185" class="step-body">• Synchronizes burst traffic</text>
    <text x="20" y="210" class="step-body">• Project Loom Virtual Thread</text>
    <text x="20" y="235" class="step-body">  safe (carrier non-blocking)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 315,235 L 345,235" stroke="#ffd166" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="345,230 355,235 345,240" fill="#ffd166" />

  <!-- Step 2 Card -->
  <g transform="translate(350, 95)" filter="url(#cShadow)">
    <rect width="270" height="280" rx="10" fill="#0c2340" stroke="#00b4d8" stroke-width="1.2" />
    <circle cx="35" cy="40" r="18" fill="#1e3d59" stroke="#ffd166" stroke-width="1.5" />
    <text x="35" y="46" text-anchor="middle" class="step-num">2</text>
    <text x="65" y="44" class="step-head">Serializable Isolation</text>

    <g transform="translate(20, 80)">
      <rect width="230" height="24" rx="4" fill="#00b4d8" />
      <text x="115" y="16" text-anchor="middle" class="badge">TRANSACTION_SERIALIZABLE</text>
    </g>

    <text x="20" y="135" class="step-body">• Highest ACID isolation level</text>
    <text x="20" y="160" class="step-body">• Prevents dirty &amp; phantom reads</text>
    <text x="20" y="185" class="step-body">• Atomic multi-table transactions</text>
    <text x="20" y="210" class="step-body">• Automated rollback on any</text>
    <text x="20" y="235" class="step-body">  seat booking failure</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 630,235 L 660,235" stroke="#ffd166" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="660,230 670,235 660,240" fill="#ffd166" />

  <!-- Step 3 Card -->
  <g transform="translate(665, 95)" filter="url(#cShadow)">
    <rect width="260" height="280" rx="10" fill="#0c2340" stroke="#00b4d8" stroke-width="1.2" />
    <circle cx="35" cy="40" r="18" fill="#1e3d59" stroke="#ffd166" stroke-width="1.5" />
    <text x="35" y="46" text-anchor="middle" class="step-num">3</text>
    <text x="65" y="44" class="step-head">Row Locks &amp; RAC Chain</text>

    <g transform="translate(20, 80)">
      <rect width="220" height="24" rx="4" fill="#06d6a0" />
      <text x="110" y="16" text-anchor="middle" class="badge">SELECT FOR UPDATE</text>
    </g>

    <text x="20" y="135" class="step-body">• 1. Lock train_seats row</text>
    <text x="20" y="160" class="step-body">• 2. Lock seat_availability row</text>
    <text x="20" y="185" class="step-body">• 3. Atomic seat decrement</text>
    <text x="20" y="210" class="step-body">• 4. RAC buffer (10 seats/coach)</text>
    <text x="20" y="235" class="step-body">• 5. Cancellation triggers promotion</text>
  </g>
</svg>