# ===================================================================
# Railway Booking System - Test Environment
# ===================================================================
# This configuration is used when spring.profiles.active=test
# Optimized for automated testing with in-memory database

# ===================================================================
# DATABASE CONFIGURATION - Test (H2 In-Memory with MySQL compatibility)
# ===================================================================
# Use H2 in-memory database for fast testing with MySQL compatibility mode
# This ensures SQL compatibility with MySQL/PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Initialize schema for tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql

# ===================================================================
# HIKARICP CONNECTION POOL - Test
# ===================================================================
# Minimal pool for testing
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=RailwayBookingPool-Test

# ===================================================================
# LOGGING - Test (Minimal)
# ===================================================================
# Minimal logging for faster test execution
logging.level.root=WARN
logging.level.com.railway=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.test=INFO

# ===================================================================
# SERVER CONFIGURATION - Test
# ===================================================================
# Random port for parallel test execution
server.port=0

# ===================================================================
# H2 CONSOLE
# ===================================================================
# Enable H2 console for test debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# TRANSACTION MANAGEMENT - Test
# ===================================================================
# Rollback transactions after each test
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# ===================================================================
# NOTES
# ===================================================================
# - Uses H2 in-memory database for fast, isolated tests
# - Database is recreated for each test run
# - No external database dependencies required
# - Suitable for CI/CD pipelines
