# ===================================================================
# Railway Booking System - Base Configuration
# ===================================================================
# This file contains common configuration shared across all environments.
# Environment-specific settings are in application-{profile}.properties

# ===================================================================
# APPLICATION SETTINGS
# ===================================================================
spring.application.name=Railway Booking System
server.port=8080

# ===================================================================
# ACTIVE PROFILE
# ===================================================================
# Default profile (can be overridden via command line or environment variable)
# Options: dev, prod
# Usage: java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=dev

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Root logging level
logging.level.root=INFO

# Application logging
logging.level.com.railway=INFO

# Spring framework logging
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

# Database logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=INFO

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================================================================
# JACKSON CONFIGURATION (JSON Serialization)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ===================================================================
# TRANSACTION MANAGEMENT
# ===================================================================
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ===================================================================
# JAVA 21 VIRTUAL THREADS
# ===================================================================
# Enable virtual threads for web requests (Java 21+)
spring.threads.virtual.enabled=true

# ===================================================================
# ACTUATOR (Health Checks & Monitoring)
# ===================================================================
# Uncomment for production monitoring
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when-authorized
# management.health.db.enabled=true

# ===================================================================
# NOTES
# ===================================================================
# - Database credentials are externalized to environment-specific files
# - Sensitive data should be stored in environment variables or secret managers
# - Use application-dev.properties for development
# - Use application-prod.properties for production
