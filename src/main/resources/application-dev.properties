# ===================================================================
# Railway Booking System - Development Environment
# ===================================================================
# This configuration is used when spring.profiles.active=dev
# Optimized for local development with detailed logging and debugging

# ===================================================================
# DATABASE CONFIGURATION - Development (MySQL)
# ===================================================================
# Local MySQL database - Requires MySQL 8.0+ running on localhost
# Create database first: CREATE DATABASE railway_booking;
spring.datasource.url=jdbc:mysql://localhost:3306/railway_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:qazwsx123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize schema on startup (set to 'never' after first run to avoid conflicts)
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:database/schema.sql
# spring.sql.init.data-locations=classpath:database/test_data.sql

# ===================================================================
# HIKARICP CONNECTION POOL - Development
# ===================================================================
# Smaller pool for development
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=RailwayBookingPool-Dev

# Connection testing
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===================================================================
# LOGGING - Development (Verbose)
# ===================================================================
# More detailed logging for development
logging.level.root=INFO
logging.level.com.railway=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Log to console and file
logging.file.name=logs/railway-booking-dev.log
logging.file.max-size=10MB
logging.file.max-history=7

# ===================================================================
# SERVER CONFIGURATION - Development
# ===================================================================
# Development server settings
server.port=8080

# Show detailed error messages in development
server.error.include-stacktrace=on_param
server.error.include-exception=true
server.error.include-message=always

# ===================================================================
# JACKSON - Development
# ===================================================================
# Pretty print JSON for easier debugging
spring.jackson.serialization.indent-output=true

# ===================================================================
# DEVELOPMENT FEATURES
# ===================================================================
# Enable actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ===================================================================
# NOTES
# ===================================================================
# - Database: MySQL 8.0+ required (H2 no longer default)
# - Create database manually: CREATE DATABASE railway_booking;
# - Or use createDatabaseIfNotExist=true (auto-creates)
# - Set DB_USERNAME and DB_PASSWORD environment variables to override
# - Example: export DB_USERNAME=myuser; export DB_PASSWORD=mypass
# - Detailed logging enabled for debugging
# - Smaller connection pool for local development
