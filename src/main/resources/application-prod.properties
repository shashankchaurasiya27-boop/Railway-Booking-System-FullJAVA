# ===================================================================
# Railway Booking System - Production Environment
# ===================================================================
# This configuration is used when spring.profiles.active=prod
# Optimized for production with security and performance

# ===================================================================
# DATABASE CONFIGURATION - Production
# ===================================================================
# Production database - MUST use environment variables
# DO NOT hardcode production credentials
spring.datasource.url=${DB_URL:jdbc:mysql://production-db-host:3306/railway_booking?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# HIKARICP CONNECTION POOL - Production
# ===================================================================
# Optimized pool for production load
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RailwayBookingPool-Prod

# Connection testing
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Leak detection (helps identify connection leaks)
spring.datasource.hikari.leak-detection-threshold=60000

# ===================================================================
# LOGGING - Production (Minimal)
# ===================================================================
# Minimal logging for production performance
logging.level.root=WARN
logging.level.com.railway=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=INFO

# Log to file only (not console)
logging.file.name=/var/log/railway-booking/application.log
logging.file.max-size=50MB
logging.file.max-history=30

# ===================================================================
# SERVER CONFIGURATION - Production
# ===================================================================
# Production server settings
server.port=${SERVER_PORT:8080}

# Hide error details in production
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=on_param

# ===================================================================
# SECURITY HEADERS
# ===================================================================
# Enable security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# ===================================================================
# JACKSON - Production
# ===================================================================
# Compact JSON for production (no pretty print)
spring.jackson.serialization.indent-output=false

# ===================================================================
# ACTUATOR - Production
# ===================================================================
# Limited actuator endpoints for production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Secure actuator endpoints
management.server.port=8081
management.endpoints.web.base-path=/actuator

# ===================================================================
# PERFORMANCE TUNING
# ===================================================================
# Enable caching
spring.cache.type=caffeine

# Connection pool monitoring
spring.datasource.hikari.register-mbeans=true

# ===================================================================
# SSL/TLS (if using HTTPS)
# ===================================================================
# Uncomment and configure for HTTPS
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=railway-booking

# ===================================================================
# NOTES - IMPORTANT FOR PRODUCTION
# ===================================================================
# REQUIRED ENVIRONMENT VARIABLES:
# - DB_URL: Full database connection URL
# - DB_USERNAME: Database username
# - DB_PASSWORD: Database password
# 
# OPTIONAL ENVIRONMENT VARIABLES:
# - SERVER_PORT: Server port (default: 8080)
# - SSL_KEYSTORE_PATH: Path to SSL keystore
# - SSL_KEYSTORE_PASSWORD: SSL keystore password
#
# DEPLOYMENT CHECKLIST:
# ✓ Set all required environment variables
# ✓ Configure SSL/TLS certificates
# ✓ Set up log rotation
# ✓ Configure firewall rules
# ✓ Enable monitoring and alerting
# ✓ Set up database backups
