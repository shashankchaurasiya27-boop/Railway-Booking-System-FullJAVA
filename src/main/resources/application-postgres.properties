# ===================================================================
# Railway Booking System - PostgreSQL Environment
# ===================================================================
# This configuration is used for PostgreSQL database
# Usage: --spring.profiles.active=postgres
#
# Requires PostgreSQL 12+ running on localhost
# Create database first: CREATE DATABASE railway_booking;

# ===================================================================
# DATABASE CONFIGURATION - PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/railway_booking?sslmode=disable
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize schema on startup (PostgreSQL specific schema)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema-postgresql.sql

# ===================================================================
# HIKARICP CONNECTION POOL - PostgreSQL
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RailwayBookingPool-PostgreSQL
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================================================================
# LOGGING - PostgreSQL
# ===================================================================
logging.level.root=INFO
logging.level.com.railway=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.postgresql=DEBUG

logging.file.name=logs/railway-booking-postgres.log
logging.file.max-size=10MB
logging.file.max-history=7

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.error.include-stacktrace=on_param
server.error.include-exception=true
server.error.include-message=always

# ===================================================================
# JACKSON
# ===================================================================
spring.jackson.serialization.indent-output=true

# ===================================================================
# ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ===================================================================
# NOTES
# ===================================================================
# - PostgreSQL 12+ required
# - Create database manually: CREATE DATABASE railway_booking;
# - Set DB_PASSWORD environment variable for security
# - Example: export DB_USERNAME=postgres; export DB_PASSWORD=mypass
