services:
  - type: web
    name: railway-booking-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: HEADLESS_MODE
        value: "true"
      - key: DB_URL
        fromDatabase:
          name: railway-postgres-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: railway-postgres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: railway-postgres-db
          property: password

databases:
  - name: railway-postgres-db
    plan: free
    region: oregon
    databaseName: railway_booking
    user: railway_admin
